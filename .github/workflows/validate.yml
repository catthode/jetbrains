name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build plugin archive
        run: ./build.sh
      - name: Download IntelliJ Plugin Verifier
        run: |
          verifier_url=$(curl -fsSL https://api.github.com/repos/JetBrains/intellij-plugin-verifier/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' \
            | head -n 1)
          test -n "$verifier_url"
          curl -fsSL "$verifier_url" -o "$RUNNER_TEMP/verifier.jar"
      - name: Verify against IntelliJ IDEA Community
        run: |
          java -Dplugin.verifier.home.dir="$RUNNER_TEMP/plugin-verifier" \
            -jar "$RUNNER_TEMP/verifier.jar" \
            check-plugin dist/catthode-jetbrains-0.1.0.jar IC-2025.2.1 \
            -verification-reports-dir "$RUNNER_TEMP/reports" \
            -verification-reports-formats plain,markdown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
