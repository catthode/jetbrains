name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build plugin archive
        run: ./build.sh
      - name: Download IntelliJ Plugin Verifier
        run: |
          verifier_url=$(curl -fsSL https://api.github.com/repos/JetBrains/intellij-plugin-verifier/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' \
            | head -n 1)
          test -n "$verifier_url"
          curl -fsSL "$verifier_url" -o "$RUNNER_TEMP/verifier.jar"
      - name: Download a disposable IntelliJ IDEA build
        run: |
          curl -fsSL https://download.jetbrains.com/idea/ideaIC-2025.2.1.tar.gz \
            -o "$RUNNER_TEMP/idea.tar.gz"
          mkdir -p "$RUNNER_TEMP/idea"
          tar -xzf "$RUNNER_TEMP/idea.tar.gz" -C "$RUNNER_TEMP/idea"
          ide_dir=$(find "$RUNNER_TEMP/idea" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$ide_dir"
          printf 'IDE_DIR=%s\n' "$ide_dir" >> "$GITHUB_ENV"
      - name: Verify against IntelliJ IDEA Community
        run: |
          java -Dplugin.verifier.home.dir="$RUNNER_TEMP/plugin-verifier" \
            -jar "$RUNNER_TEMP/verifier.jar" \
            check-plugin dist/catthode-jetbrains-0.1.0.jar "$IDE_DIR" \
            -verification-reports-dir "$RUNNER_TEMP/reports" \
            -verification-reports-formats plain,markdown
      - name: Install disposable GUI tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick openbox x11-utils xdotool xvfb
      - name: Download a disposable screenshot IDE
        run: |
          curl -fsSL https://download.jetbrains.com/idea/ideaIC-2022.3.3.tar.gz \
            -o "$RUNNER_TEMP/screenshot-idea.tar.gz"
          mkdir -p "$RUNNER_TEMP/screenshot-idea"
          tar -xzf "$RUNNER_TEMP/screenshot-idea.tar.gz" -C "$RUNNER_TEMP/screenshot-idea"
          screenshot_ide_dir=$(find "$RUNNER_TEMP/screenshot-idea" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$screenshot_ide_dir"
          printf 'SCREENSHOT_IDE_DIR=%s\n' "$screenshot_ide_dir" >> "$GITHUB_ENV"
      - name: Render theme in disposable IntelliJ IDEA session
        run: |
          idea_config="$RUNNER_TEMP/idea-config"
          idea_plugins="$RUNNER_TEMP/idea-plugins"
          idea_system="$RUNNER_TEMP/idea-system"
          idea_log="$RUNNER_TEMP/idea-log"
          sample_project="$RUNNER_TEMP/catthode-sample"
          mkdir -p \
            "$idea_config/options" \
            "$idea_plugins/catthode/lib" \
            "$idea_system" \
            "$idea_log" \
            "$sample_project/src"
          cp dist/catthode-jetbrains-0.1.0.jar "$idea_plugins/catthode/lib/"
          printf '%s\n' \
            "idea.config.path=$idea_config" \
            "idea.plugins.path=$idea_plugins" \
            "idea.system.path=$idea_system" \
            "idea.log.path=$idea_log" \
            'idea.initially.ask.config=false' \
            'idea.trust.all.projects=true' \
            'jb.consents.confirmation.enabled=false' \
            >> "$SCREENSHOT_IDE_DIR/bin/idea.properties"
          printf '%s\n' \
            '<application>' \
            '  <component name="LafManager" autodetect="false">' \
            '    <laf class-name="com.intellij.ide.ui.laf.darcula.DarculaLaf" themeId="com.github.catthode.jetbrains.theme" />' \
            '  </component>' \
            '</application>' \
            > "$idea_config/options/laf.xml"
          printf '%s\n' \
            'public class Main {' \
            '    public static void main(String[] args) {' \
            '        String greeting = "From CRT to OLED";' \
            '        System.out.println(greeting);' \
            '    }' \
            '}' \
            > "$sample_project/src/Main.java"
          export SCREENSHOT_IDE_DIR sample_project
          export SCREENSHOT_PATH="$RUNNER_TEMP/catthode-jetbrains.png"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -eu -o pipefail -c '
            openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
            wm_pid=$!
            "$SCREENSHOT_IDE_DIR/bin/idea.sh" "$sample_project/src/Main.java" >"$RUNNER_TEMP/idea.stdout" 2>&1 &
            app_pid=$!
            window_id=""
            for attempt in $(seq 1 90); do
              for candidate in $(xdotool search --onlyvisible --name ".*" 2>/dev/null || true); do
                window_class=$(xdotool getwindowclassname "$candidate" 2>/dev/null || true)
                window_title=$(xdotool getwindowname "$candidate" 2>/dev/null || true)
                printf "%s\t%s\t%s\n" "$candidate" "$window_class" "$window_title" >>"$RUNNER_TEMP/windows.txt"
                if printf "%s %s" "$window_class" "$window_title" | grep -Eqi "jetbrains|intellij|catthode-sample|Main.java"; then
                  window_id="$candidate"
                fi
              done
              test -n "$window_id" && break
              kill -0 "$app_pid" 2>/dev/null || break
              sleep 1
            done
            xwininfo -root -tree >>"$RUNNER_TEMP/windows.txt" 2>&1 || true
            test -n "$window_id"
            sleep 25
            xdotool windowmove "$window_id" 0 0
            xdotool windowsize "$window_id" 1280 800
            sleep 2
            import -window "$window_id" "$SCREENSHOT_PATH"
            kill "$app_pid" || true
            kill "$wm_pid" || true
          '
          test -s "$SCREENSHOT_PATH"
          identify -format '%wx%h %k colors, mean=%[fx:mean]\n' "$SCREENSHOT_PATH"
          test "$(identify -format '%k' "$SCREENSHOT_PATH")" -gt 64
          test "$(convert "$SCREENSHOT_PATH" -colorspace gray -format '%[fx:mean<0.55?1:0]' info:)" -eq 1
          black_pixels=$(convert "$SCREENSHOT_PATH" -format %c histogram:info:- \
            | awk '/#000000/{gsub(":", "", $1); print $1; exit}')
          test "${black_pixels:-0}" -gt 10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catthode-jetbrains-screenshot
          path: |
            ${{ runner.temp }}/catthode-jetbrains.png
            ${{ runner.temp }}/idea.stdout
            ${{ runner.temp }}/idea-log
            ${{ runner.temp }}/openbox.log
            ${{ runner.temp }}/windows.txt
          if-no-files-found: ignore
